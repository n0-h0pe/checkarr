services:
  healthchecker:
    build: .
    container_name: healthchecker
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Restricted, settings/API-key-free dashboard-only view - safe to
      # expose externally (port-forward, separate reverse-proxy host, etc.)
      # in a way you wouldn't want to do with 8080. Remove this mapping (and
      # set HC_PUBLIC_DASHBOARD_ENABLED=false) if you don't want it at all.
      - "8090:8090"
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ./config:/config
      # Optional: bind-mount the SAME host paths Radarr/Sonarr use, read-only,
      # so a "filesystem_path" check can independently confirm a drive/share
      # is actually mounted here too. Not required - the built-in
      # "Root folders accessible" check reads this straight from Radarr/
      # Sonarr's own API and needs no extra mounts. Example:
      # - /mnt/media:/mnt/media:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
