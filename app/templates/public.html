<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkarr Status</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="public-page{{ ' wide-main' if page == 'dashboard' else '' }}">
  {% if page == "dashboard" %}
  <main>
    <div class="public-dashboard-bar">
      <div class="summary-pill" id="summary-pill"></div>
      <div class="uptime-range-control">
        <select id="uptime-range-select" title="Uptime strip range"></select>
      </div>
    </div>
    <div class="cards-grid" id="dashboard-grid"></div>
  </main>
  {% elif page == "history" %}
  <main>
    <div class="panel">
      <div class="panel-header">
        <h2>Check history</h2>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <select id="history-service"></select>
          <div class="uptime-range-control"><select id="uptime-range-select" title="History range"></select></div>
          <button type="button" class="small" id="history-columns-btn">Columns</button>
          <button type="button" class="small" id="history-export-btn">Export CSV</button>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal-backdrop hidden" id="columns-modal">
    <div class="modal">
      <h3>Customize columns</h3>
      <div class="hint" style="margin-bottom:10px;">Drag to reorder, check to show. At least one must stay visible.</div>
      <div id="columns-list"></div>
      <div class="modal-actions">
        <button type="button" class="primary" id="columns-done">Done</button>
      </div>
    </div>
  </div>
  {% elif page == "notifications" %}
  <main>
    <div class="panel">
      <div class="panel-header">
        <h2>Consolidated notifications</h2>
        <label class="field checkbox" style="margin:0">
          <input type="checkbox" id="show-resolved">
          <span>Show resolved</span>
        </label>
      </div>
      <div id="notifications-list"></div>
    </div>
  </main>
  {% endif %}

  {% if page == "dashboard" %}
  <div class="public-footer-links">
    <a href="/history">history</a>
    <a href="/notifications">notifications</a>
  </div>
  {% endif %}

  <script>window.PUBLIC_PAGE = "{{ page }}";</script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/public.js"></script>
</body>
</html>
